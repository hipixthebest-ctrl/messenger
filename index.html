<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мессенджер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #7c6af7;
    --accent2: #4fffb0;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --danger: #ff4f6a;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    overflow: hidden;
  }

  /* ── AUTH ── */
  #auth-screen {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 30% 40%, #1a1040 0%, var(--bg) 60%);
  }

  .auth-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    width: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .auth-box h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .auth-tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 10px;
  }

  .auth-tabs button {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }

  .auth-tabs button.active {
    background: var(--accent);
    color: #fff;
  }

  input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }

  input:focus { border-color: var(--accent); }

  .btn {
    padding: 12px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 700;
    transition: all .15s;
    letter-spacing: 0.3px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: #6a58e0; transform: translateY(-1px); }

  .btn-danger {
    background: var(--danger);
    color: #fff;
  }

  .btn-success {
    background: var(--accent2);
    color: #000;
  }

  #error-msg {
    color: var(--danger);
    font-size: 12px;
    min-height: 16px;
  }

  /* ── APP ── */
  #app {
    display: none;
    width: 100%;
    height: 100%;
  }

  #app.visible { display: flex; }

  /* Sidebar */
  .sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-header span {
    font-family: 'Unbounded', sans-serif;
    font-size: 12px;
    color: var(--accent2);
  }

  #my-username {
    font-size: 13px;
    color: var(--muted);
  }

  .rooms-section { padding: 12px; flex: 1; overflow-y: auto; }

  .rooms-section h3 {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .room-item {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    transition: all .15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .room-item:hover { background: var(--surface2); color: var(--text); }
  .room-item.active { background: var(--accent); color: #fff; }
  .room-item::before { content: '#'; opacity: .5; font-size: 15px; }

  .add-room {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
  }

  .add-room input { font-size: 12px; padding: 8px 10px; }
  .add-room .btn { padding: 8px 12px; font-size: 11px; }

  /* Users panel */
  .users-panel {
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .users-panel h3 {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .user-item {
    padding: 6px 8px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 6px;
  }

  .user-item .call-btn {
    background: var(--accent2);
    border: none;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    color: #000;
    font-weight: 600;
    display: none;
  }

  .user-item:hover .call-btn { display: block; }

  /* Chat area */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
  }

  .chat-header h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    color: var(--text);
  }

  .chat-header .room-tag {
    font-size: 16px;
    color: var(--accent);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    max-width: 70%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }

  .msg.mine {
    background: var(--accent);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .msg.theirs {
    background: var(--surface2);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .msg .meta {
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 3px;
  }

  .msg.mine .meta { text-align: right; }

  .msg-system {
    align-self: center;
    font-size: 11px;
    color: var(--muted);
    padding: 4px 12px;
    background: var(--surface2);
    border-radius: 20px;
  }

  .chat-input-area {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    background: var(--surface);
  }

  .chat-input-area input {
    flex: 1;
    font-size: 14px;
  }

  .chat-input-area .btn {
    padding: 10px 18px;
    flex-shrink: 0;
  }

  .no-room {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    flex-direction: column;
    gap: 8px;
  }

  .no-room span { font-size: 32px; }

  /* ── CALL OVERLAY ── */
  #call-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
  }

  #call-overlay.visible { display: flex; }

  .call-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .call-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-family: 'Unbounded', sans-serif;
    margin: 0 auto;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(124,106,247,0.4); }
    50% { box-shadow: 0 0 0 16px rgba(124,106,247,0); }
  }

  .call-status {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .call-name {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    color: var(--text);
  }

  .call-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 8px;
  }

  .call-actions .btn {
    flex: 1;
    padding: 12px;
  }

  audio { display: none; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <h1>💬 Мессенджер</h1>
    <div class="auth-tabs">
      <button class="active" onclick="showTab('login')">Войти</button>
      <button onclick="showTab('register')">Регистрация</button>
    </div>
    <input id="auth-username" type="text" placeholder="Логин">
    <input id="auth-password" type="password" placeholder="Пароль">
    <button class="btn btn-primary" onclick="authAction()">Войти</button>
    <div id="error-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>💬 msngr</span>
      <div id="my-username"></div>
    </div>

    <div class="rooms-section">
      <h3>Комнаты</h3>
      <div id="rooms-list"></div>
    </div>

    <div class="add-room">
      <input id="new-room-input" type="text" placeholder="новая комната">
      <button class="btn btn-primary" onclick="joinRoom()">+</button>
    </div>

    <div class="users-panel">
      <h3>Онлайн</h3>
      <div id="users-list"></div>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="no-room" id="no-room">
      <span>#</span>
      Выбери или создай комнату
    </div>

    <div id="chat-main" style="display:none; flex:1; display:none; flex-direction:column; overflow:hidden;">
      <div class="chat-header">
        <span class="room-tag">#</span>
        <h2 id="room-title">комната</h2>
      </div>
      <div id="messages"></div>
      <div class="chat-input-area">
        <input id="msg-input" type="text" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn btn-primary" onclick="sendMessage()">→</button>
      </div>
    </div>
  </div>
</div>

<!-- CALL OVERLAY -->
<div id="call-overlay">
  <div class="call-box">
    <div class="call-avatar" id="call-avatar">?</div>
    <div class="call-status" id="call-status">ВХОДЯЩИЙ ЗВОНОК</div>
    <div class="call-name" id="call-name">...</div>
    <div class="call-actions" id="call-actions">
      <button class="btn btn-success" onclick="acceptCall()">Принять</button>
      <button class="btn btn-danger" onclick="rejectCall()">Отклонить</button>
    </div>
  </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script src="/static/app.js"></script>
</body>
</html>
